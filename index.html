<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10093A">
<title>Parampara &amp; Pragati · Diwali wishes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Serif+Gujarati:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#10093A; --night2:#1B1259; --dusk:#2B1470;
  --gold:#FFB43A; --gold-soft:#FFD27A; --flame-core:#FFF3C9;
  --rani:#E6407E; --volt:#7C6CFF; --cream:#FFECCD;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:linear-gradient(180deg,var(--night) 0%,var(--night2) 55%,var(--dusk) 100%);
  background-color:var(--night);
  color:var(--cream);
  font-family:"Noto Serif Gujarati","Noto Serif Devanagari",Georgia,"Shruti","Mangal",serif;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}
/* faint dot grid: the "tomorrow" layer */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(124,108,255,.35) 1px,transparent 1.3px);
  background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,transparent 25%,#000 100%);
  mask-image:linear-gradient(180deg,transparent 25%,#000 100%);
}
/* warm bloom: the "tradition" layer, switched on by the flame */
.bloom{
  position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.8s ease;
  background:radial-gradient(circle at 50% 36%,rgba(255,170,60,.34) 0%,rgba(230,64,126,.12) 38%,transparent 65%);
}
body.lit .bloom{opacity:1}

main{
  position:relative;width:100%;max-width:34rem;flex:1;
  padding:1.8rem 1.2rem 2.2rem;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
h1{
  font-family:"Yatra One","Noto Serif Gujarati","Noto Serif Devanagari",Georgia,serif;font-weight:400;
  font-size:clamp(2.2rem,10vw,3.3rem);line-height:1.12;margin:0;color:var(--gold);text-wrap:balance;
  text-shadow:0 0 28px rgba(255,180,58,.35);
}
.sub{margin:.45rem 0 0;font-size:1.15rem;letter-spacing:.02em;color:var(--gold-soft);opacity:.9}

.tag{margin:.8rem 0 0;font-size:1rem;line-height:1.55;letter-spacing:.01em;text-wrap:balance}
.tag span{display:block}
.tag span:first-child{color:var(--cream);font-weight:600}
.tag span+span{color:var(--gold-soft);margin-top:.15rem}
.stage{position:relative;width:min(92vw,25rem,50vh);aspect-ratio:1;margin:1.4rem 0 .6rem}
@supports (height:1svh){.stage{width:min(92vw,25rem,50svh)}}
.art{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* petals (rangoli) */
.petal{transform-origin:200px 200px;opacity:.22;transform:scale(.7);
  transition:transform 1.2s cubic-bezier(.2,.9,.2,1),opacity 1.2s}
body.lit .petal{opacity:1;transform:scale(1)}

/* circuit traces: violet while asleep, gold once the diya is lit */
.tr{fill:none;stroke:var(--volt);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.45;
  transition:stroke .9s,opacity .9s}
.nd{fill:var(--volt);opacity:.55;transition:fill .9s,opacity .9s}
.ring-dots{fill:none;stroke:var(--volt);stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round;opacity:.45;transition:stroke .9s}
body.lit .tr{stroke:var(--gold);opacity:.9}
body.lit .nd{fill:var(--gold-soft);opacity:1}
body.lit .ring-dots{stroke:var(--gold-soft)}
body.lit .circuits{filter:drop-shadow(0 0 4px rgba(255,180,58,.55))}
.pl{fill:none;stroke:var(--flame-core);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 93;stroke-dashoffset:7;opacity:0}
body.lit .pl{opacity:1;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-93}}

/* sound bars */
.bar{stroke:var(--gold);stroke-width:3;stroke-linecap:round}

/* diya */
.ping{
  position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;border-radius:50%;
  border:2px solid var(--gold);transform:translate(-50%,-50%);opacity:0;
  animation:ping 2.2s ease-out infinite;pointer-events:none;
}
.ping.b{animation-delay:1.1s}
body.lit .ping{display:none}
@keyframes ping{0%{opacity:.8;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.3)}}
.diya-btn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:36%;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;
  -webkit-tap-highlight-color:transparent;
}
.diya-btn:focus-visible{outline:3px solid var(--rani);outline-offset:8px}
.diya-btn svg{width:100%;height:100%;overflow:visible}
.flame{transform-origin:100px 92px;transform:scale(0);transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
body.lit .flame{transform:scale(1);animation:flicker 2.6s ease-in-out .8s infinite}
.glow{opacity:0;transition:opacity 1.2s}
body.lit .glow{opacity:1}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(0)}
  30%{transform:scale(1.05,.96) rotate(-2deg)}
  60%{transform:scale(.97,1.06) rotate(2deg)}
}

.hint{font-size:1.2rem;font-weight:600;margin:.4rem 0 1rem;color:var(--gold-soft);min-height:1.7em}

.langs{display:inline-flex;gap:.5rem;margin:0 0 1.2rem}
.langs button{
  font:inherit;font-size:1.05rem;padding:.4rem 1.2rem;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--gold);background:transparent;color:var(--cream);
}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1A1030;font-weight:600}
.langs button:focus-visible{outline:3px solid var(--rani);outline-offset:3px}
.wish{
  margin:0;max-width:30rem;font-size:1.3rem;line-height:1.95;
  opacity:0;transition:opacity 1s .4s;
}
body.lit .wish{opacity:1}
.s{color:rgba(255,236,205,.38);transition:color .5s}
.s.on{color:var(--gold-soft);text-shadow:0 0 18px rgba(255,180,58,.4)}
.s.done{color:rgba(255,236,205,.95)}

.replay{
  margin-top:1.4rem;font:inherit;font-size:1.05rem;font-weight:600;
  padding:.55rem 1.5rem;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--gold);background:transparent;color:var(--gold-soft);
  visibility:hidden;
}
body.done .replay{visibility:visible}
.replay:focus-visible{outline:3px solid var(--rani);outline-offset:3px}
.replay:hover{background:rgba(255,180,58,.14)}
.note{font-size:.95rem;line-height:1.6;color:var(--gold-soft);opacity:.85;margin:.9rem 0 0;min-height:1.2em;max-width:26rem}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .pl{display:none}
}
</style>
</head>

</main>

    playEmbedded();
  }

  $("diya").addEventListener("click", function(){
    document.body.classList.add("lit");
    start();
  });
  $("replay").addEventListener("click", start);
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.dataset.lang === lang) return;
      lang = b.dataset.lang;
      renderLang();
      if (document.body.classList.contains("lit")) start();
    });
  });

  renderLang();
})();
</script>
</body>
</html>
