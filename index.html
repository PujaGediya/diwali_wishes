<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10093A">
<title>AI-wali Diwali · Tradition Meets Tomorrow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%94%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Serif+Gujarati:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#10093A; --night2:#1B1259; --dusk:#2B1470;
  --gold:#FFB43A; --gold-soft:#FFD27A; --flame-core:#FFF3C9;
  --rani:#E6407E; --volt:#7C6CFF; --cream:#FFECCD;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:linear-gradient(180deg,var(--night) 0%,var(--night2) 55%,var(--dusk) 100%);
  background-color:var(--night);
  color:var(--cream);
  font-family:"Noto Serif Gujarati","Noto Serif Devanagari",Georgia,"Shruti","Mangal",serif;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
}
/* faint dot grid: the "tomorrow" layer */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(124,108,255,.35) 1px,transparent 1.3px);
  background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,transparent 25%,#000 100%);
  mask-image:linear-gradient(180deg,transparent 25%,#000 100%);
}
/* warm bloom: the "tradition" layer, switched on by the flame */
.bloom{
  position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.8s ease;
  background:radial-gradient(circle at 50% 36%,rgba(255,170,60,.34) 0%,rgba(230,64,126,.12) 38%,transparent 65%);
}
body.lit .bloom{opacity:1}

main{
  position:relative;width:100%;max-width:34rem;flex:1;
  padding:1.8rem 1.2rem 2.2rem;
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
h1{
  font-family:"Yatra One","Noto Serif Gujarati","Noto Serif Devanagari",Georgia,serif;font-weight:400;
  font-size:clamp(2.5rem,12vw,3.6rem);line-height:1.1;margin:0;color:var(--gold);
  text-shadow:0 0 28px rgba(255,180,58,.35);
}
.sub{margin:.45rem 0 0;font-size:1.15rem;letter-spacing:.02em;color:var(--gold-soft);opacity:.9}

.stage{position:relative;width:min(92vw,25rem,50vh);aspect-ratio:1;margin:1.4rem 0 .6rem}
@supports (height:1svh){.stage{width:min(92vw,25rem,50svh)}}
.art{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

/* petals (rangoli) */
.petal{transform-origin:200px 200px;opacity:.22;transform:scale(.7);
  transition:transform 1.2s cubic-bezier(.2,.9,.2,1),opacity 1.2s}
body.lit .petal{opacity:1;transform:scale(1)}

/* circuit traces: violet while asleep, gold once the diya is lit */
.tr{fill:none;stroke:var(--volt);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.45;
  transition:stroke .9s,opacity .9s}
.nd{fill:var(--volt);opacity:.55;transition:fill .9s,opacity .9s}
.ring-dots{fill:none;stroke:var(--volt);stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round;opacity:.45;transition:stroke .9s}
body.lit .tr{stroke:var(--gold);opacity:.9}
body.lit .nd{fill:var(--gold-soft);opacity:1}
body.lit .ring-dots{stroke:var(--gold-soft)}
body.lit .circuits{filter:drop-shadow(0 0 4px rgba(255,180,58,.55))}
.pl{fill:none;stroke:var(--flame-core);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:7 93;stroke-dashoffset:7;opacity:0}
body.lit .pl{opacity:1;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-93}}

/* sound bars */
.bar{stroke:var(--gold);stroke-width:3;stroke-linecap:round}

/* diya */
.ping{
  position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;border-radius:50%;
  border:2px solid var(--gold);transform:translate(-50%,-50%);opacity:0;
  animation:ping 2.2s ease-out infinite;pointer-events:none;
}
.ping.b{animation-delay:1.1s}
body.lit .ping{display:none}
@keyframes ping{0%{opacity:.8;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.3)}}
.diya-btn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:36%;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;border-radius:50%;
  -webkit-tap-highlight-color:transparent;
}
.diya-btn:focus-visible{outline:3px solid var(--rani);outline-offset:8px}
.diya-btn svg{width:100%;height:100%;overflow:visible}
.flame{transform-origin:100px 92px;transform:scale(0);transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
body.lit .flame{transform:scale(1);animation:flicker 2.6s ease-in-out .8s infinite}
.glow{opacity:0;transition:opacity 1.2s}
body.lit .glow{opacity:1}
@keyframes flicker{
  0%,100%{transform:scale(1) rotate(0)}
  30%{transform:scale(1.05,.96) rotate(-2deg)}
  60%{transform:scale(.97,1.06) rotate(2deg)}
}

.hint{font-size:1.2rem;font-weight:600;margin:.4rem 0 1rem;color:var(--gold-soft);min-height:1.7em}

.langs{display:inline-flex;gap:.5rem;margin:0 0 1.2rem}
.langs button{
  font:inherit;font-size:1.05rem;padding:.4rem 1.2rem;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--gold);background:transparent;color:var(--cream);
}
.langs button[aria-pressed="true"]{background:var(--gold);color:#1A1030;font-weight:600}
.langs button:focus-visible{outline:3px solid var(--rani);outline-offset:3px}
.wish{
  margin:0;max-width:30rem;font-size:1.3rem;line-height:1.95;
  opacity:0;transition:opacity 1s .4s;
}
body.lit .wish{opacity:1}
.s{color:rgba(255,236,205,.38);transition:color .5s}
.s.on{color:var(--gold-soft);text-shadow:0 0 18px rgba(255,180,58,.4)}
.s.done{color:rgba(255,236,205,.95)}

.replay{
  margin-top:1.4rem;font:inherit;font-size:1.05rem;font-weight:600;
  padding:.55rem 1.5rem;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--gold);background:transparent;color:var(--gold-soft);
  visibility:hidden;
}
body.done .replay{visibility:visible}
.replay:focus-visible{outline:3px solid var(--rani);outline-offset:3px}
.replay:hover{background:rgba(255,180,58,.14)}
.note{font-size:.95rem;line-height:1.6;color:var(--gold-soft);opacity:.85;margin:.9rem 0 0;min-height:1.2em;max-width:26rem}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .pl{display:none}
}
</style>
</head>
<body>
<div class="bloom" aria-hidden="true"></div>
<main>
  <h1>AI-wali Diwali</h1>
  <p class="sub" lang="en">Tradition Meets Tomorrow</p>

  <div class="stage">
    <svg class="art" viewBox="0 0 400 400" aria-hidden="true">
      <circle class="ring-dots" cx="200" cy="200" r="196"/>
      <g id="petals"></g>
      <g id="circuits" class="circuits"></g>
      <g id="bars"></g>
    </svg>
    <div class="ping" aria-hidden="true"></div>
    <div class="ping b" aria-hidden="true"></div>

    <button class="diya-btn" id="diya" type="button" aria-label="દીવો પ્રગટાવો અને શુભેચ્છા સાંભળો">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="g" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#FFB43A" stop-opacity=".6"/>
            <stop offset="1" stop-color="#FFB43A" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="glow" cx="100" cy="80" r="95" fill="url(#g)"/>
        <g class="flame">
          <path d="M100 30 C118 55 122 72 112 86 C106 94 94 94 88 86 C78 72 84 55 100 30Z" fill="#FFB43A"/>
          <path d="M100 52 C108 66 109 76 104 83 C101 87 99 87 96 83 C91 76 93 66 100 52Z" fill="#FFF3C9"/>
        </g>
        <rect x="98" y="86" width="4" height="10" rx="2" fill="#C9BBE0"/>
        <path d="M28 104 Q100 92 172 104 Q164 150 100 156 Q36 150 28 104Z" fill="#B5502D"/>
        <path d="M28 104 Q100 116 172 104" fill="none" stroke="#FFB43A" stroke-width="5" stroke-linecap="round"/>
        <g fill="#FFB43A"><circle cx="62" cy="130" r="5"/><circle cx="100" cy="137" r="5"/><circle cx="138" cy="130" r="5"/></g>
        <path d="M172 104 Q186 98 190 90" fill="none" stroke="#B5502D" stroke-width="7" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <p class="hint" id="hint" aria-live="polite"></p>

  <div class="langs" role="group" aria-label="ભાષા / भाषा">
    <button type="button" data-lang="gu" aria-pressed="true">ગુજરાતી</button>
    <button type="button" data-lang="hi" aria-pressed="false">हिन्दी</button>
  </div>

  <p class="wish" id="wish"></p>

  <button class="replay" id="replay" type="button">ફરી સાંભળો</button>
  <p class="note" id="note" aria-live="polite"></p>
</main>

    ph += '<g class="petal" style="transition-delay:' + (i * 0.05).toFixed(2) + 's"><ellipse cx="200" cy="61" rx="9" ry="13" fill="' +
          (i % 2 ? "var(--rani)" : "var(--gold)") + '" transform="rotate(' + (i * 30) + ' 200 200)"/></g>';
  }
  $("petals").innerHTML = ph;

  /* ---- Circuit traces ---- */
  var ch = "", n = 0;
  function addTrace(d, endPt, r){
    var delay = (n * 0.21).toFixed(2);
    ch += '<path class="tr" d="' + d + '"/>';
    ch += '<path class="pl" pathLength="100" style="animation-delay:' + delay + 's" d="' + d + '"/>';
    ch += '<circle class="nd" cx="' + endPt[0].toFixed(1) + '" cy="' + endPt[1].toFixed(1) + '" r="' + r + '"/>';
    n++;
  }
  for (var k = 0; k < 12; k++){
    var a = 15 + k * 30;
    var p1 = pol(156, a), p2 = pol(168, a), p3 = pol(178, a + 7), p4 = pol(188, a + 7);
    addTrace("M" + pt(p1) + " L" + pt(p2) + " L" + pt(p3) + " L" + pt(p4), p4, 3.4);
    if (k % 2 === 0){
      var b1 = pol(180, a - 8), b2 = pol(188, a - 8);
      addTrace("M" + pt(p2) + " L" + pt(b1) + " L" + pt(b2), b2, 2.7);
    }
  }
  $("circuits").innerHTML = ch;

  /* ---- Sound bars (rest as a dotted ring, move while the wish plays) ---- */
  var BARS = [], barsG = $("bars");
  for (var j = 0; j < 48; j++){
    var ln = document.createElementNS(NS, "line");
    ln.setAttribute("class", "bar");
    barsG.appendChild(ln);
    BARS.push(ln);
  }
  function setBars(level, t){
    for (var q = 0; q < BARS.length; q++){
      var ang = q * 7.5;
      var amp = (0.55 + 0.45 * Math.sin(t * 7 + q * 0.9)) * (0.6 + 0.4 * Math.sin(t * 3.1 + q * 2.1));
      var len = 4 + level * (2 + 20 * Math.abs(amp));
      var s = pol(98, ang), e = pol(98 + len, ang);
      BARS[q].setAttribute("x1", s[0].toFixed(1)); BARS[q].setAttribute("y1", s[1].toFixed(1));
      BARS[q].setAttribute("x2", e[0].toFixed(1)); BARS[q].setAttribute("y2", e[1].toFixed(1));
    }
  }
  setBars(0, 0);

  var speaking = false, raf = null;
  function tick(ts){
    raf = null;
    setBars(speaking ? 1 : 0, ts / 1000);
    if (speaking) raf = requestAnimationFrame(tick);
  }
  function barsOn(){
    if (reduce){ setBars(0.5, 1); return; }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function barsOff(){ speaking = false; setBars(0, 0); }

  /* ---- Message with sentence-by-sentence highlight ---- */
  var wish = $("wish"), hint = $("hint"), note = $("note");
  var spans = [], TOTAL_CHARS = 0;
  function activate(i){
    for (var x = 0; x < spans.length; x++){
      spans[x].classList.toggle("on", x === i);
      spans[x].classList.toggle("done", x < i);
    }
  }
  function resetSpans(){ for (var x = 0; x < spans.length; x++){ spans[x].classList.remove("on", "done"); } }

  var timers = [], watch = null;
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
  function clearWatch(){ if (watch){ clearTimeout(watch); watch = null; } }

  function finish(){
    clearTimers(); clearWatch();
    for (var x = 0; x < spans.length; x++){ spans[x].classList.remove("on"); spans[x].classList.add("done"); }
    barsOff();
    hint.textContent = L[lang].done;
    document.body.classList.add("done");
  }
  function timedReveal(totalSec){
    clearTimers();
    var acc = 0;
    SENT.forEach(function(s, idx){
      (function(i, at){ timers.push(setTimeout(function(){ activate(i); }, at * 1000)); })(idx, acc);
      acc += totalSec * (s.length / TOTAL_CHARS);
    });
    timers.push(setTimeout(finish, acc * 1000 + 400));
  }
  function estSeconds(){ return TOTAL_CHARS * 0.085 + SENT.length * 0.4; }

  function renderLang(){
    var m = L[lang];
    SENT = m.sent;
    TOTAL_CHARS = SENT.reduce(function(a, t){ return a + t.length; }, 0);
    document.documentElement.lang = lang;
    wish.setAttribute("lang", lang);
    wish.innerHTML = SENT.map(function(t){ return '<span class="s">' + t + '</span>'; }).join(" ");
    spans = wish.querySelectorAll(".s");
    $("replay").textContent = m.replay;
    $("diya").setAttribute("aria-label", m.aria);
    if (!document.body.classList.contains("lit")) hint.textContent = m.hint;
    document.querySelectorAll(".langs button").forEach(function(b){
      b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
    });
  }

  /* ---- Audio: recorded file if present, otherwise the device voice ---- */
  var hasFile = { gu: false, hi: false }, audioEl = null;
  ["gu", "hi"].forEach(function(k){
    try {
      fetch(L[k].file, { method: "HEAD" }).then(function(r){
        var ct = r.headers.get("content-type") || "";
        hasFile[k] = r.ok && /audio|octet-stream|mpeg/i.test(ct);
      }).catch(function(){});
    } catch(e){}
  });

  var synth = window.speechSynthesis, voices = [];
  function loadVoices(){ if (synth) voices = synth.getVoices() || []; }
  loadVoices();
  if (synth && "onvoiceschanged" in synth) synth.onvoiceschanged = loadVoices;
  function pickVoice(prefix){
    var list = voices.filter(function(v){ return v.lang && v.lang.toLowerCase().replace("_", "-").indexOf(prefix) === 0; });
    return list[0] || null;
  }

  function playEmbedded(){
    var e = window.EMB && window.EMB[lang];
    if (!e){ note.textContent = L[lang].failed; timedReveal(estSeconds()); return; }
    clearTimers();
    audioEl = new Audio("data:audio/mpeg;base64," + e.b64);
    audioEl.addEventListener("playing", function(){
      clearTimers();
      e.times.forEach(function(tm, i){ timers.push(setTimeout(function(){ activate(i); }, tm[0] * 1000)); });
    }, { once: true });
    audioEl.addEventListener("ended", finish);
    var pr = audioEl.play();
    if (pr && pr.catch){ pr.catch(function(){
      clearTimers(); note.textContent = L[lang].failed; timedReveal(estSeconds());
    }); }
  }

  function start(){
    note.textContent = "";
    clearTimers(); clearWatch();
    document.body.classList.remove("done");
    resetSpans();
    var wasBusy = synth && (synth.speaking || synth.pending);
    if (synth) synth.cancel();
    if (audioEl){ try { audioEl.pause(); } catch(e){} audioEl = null; }
    hint.textContent = L[lang].playing;
    speaking = true; barsOn();

    var m = L[lang];

    // 1) your own recording (wish-gu.mp3 / wish-hi.mp3), if you added one
    if (hasFile[lang]){
      audioEl = new Audio(m.file);
      audioEl.addEventListener("loadedmetadata", function(){
        if (isFinite(audioEl.duration)) timedReveal(audioEl.duration);
      });
      audioEl.addEventListener("ended", finish);
      var pr = audioEl.play();
      if (pr && pr.catch){ pr.catch(function(){ playEmbedded(); }); }
      return;
    }

    // 2) the device's own voice, when it has one for this language
    loadVoices();
    var v = pickVoice(lang);
    if (!(synth && typeof SpeechSynthesisUtterance !== "undefined" && v)){
      // 3) built-in audio that works on every device
      playEmbedded();
      return;
    }
    var started = false;
    function fallback(){
      if (synth) synth.cancel();
      clearWatch();
      if (started){ finish(); } else { playEmbedded(); }
    }
    function speakAll(){
      SENT.forEach(function(t, idx){
        var u = new SpeechSynthesisUtterance(t);
        u.lang = m.code;
        u.voice = v;
        u.rate = 0.9; u.pitch = 1.05;
        u.onstart = function(){ started = true; clearWatch(); activate(idx); };
        if (idx === SENT.length - 1){ u.onend = finish; }
        u.onerror = function(e){
          if (e && e.error && e.error !== "interrupted" && e.error !== "canceled"){ fallback(); }
        };
        synth.speak(u);
      });
      watch = setTimeout(function(){ if (!started) fallback(); }, 3500);
    }
    if (wasBusy){ setTimeout(speakAll, 120); } else { speakAll(); }
  }

  $("diya").addEventListener("click", function(){
    document.body.classList.add("lit");
    start();
  });
  $("replay").addEventListener("click", start);
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.dataset.lang === lang) return;
      lang = b.dataset.lang;
      renderLang();
      if (document.body.classList.contains("lit")) start();
    });
  });

  renderLang();
})();
</script>
</body>
</html>
